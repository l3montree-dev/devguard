[project]
name = "devguard-scanner-tools"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "semgrep==1.172.0",
    "checkov==3.3.8",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { cryptography = "2026-08-05T00:00:00Z", gitpython = "2026-08-05T00:00:00Z"}
# Pin transitive deps to versions that fix known CVEs.
# These constraints are enforced during `uv lock` and captured in uv.lock —
# no manual Nix overrides needed.
constraint-dependencies = [
    "gitpython==3.1.58",
    "cryptography==50.0.0",
    "requests==2.34.2",
    "h11==0.16.0",
]
