[project]
name = "devguard-scanner-tools"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "semgrep==1.182.0",
    "checkov==3.3.30",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { semgrep = "2026-10-20T21:32:31.377Z", checkov = "2026-10-20T14:00:16.988Z" }
# Pin transitive deps to versions that fix known CVEs.
# These constraints are enforced during `uv lock` and captured in uv.lock —
# no manual Nix overrides needed.
constraint-dependencies = [

]
