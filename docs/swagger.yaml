components:
  schemas:
    compliance.PolicyEvaluation:
      properties:
        compliant:
          type: boolean
        description:
          type: string
        id:
          type: string
        opaqueId:
          description: only used by global policies maintained by the community and
            migrated by the system
          type: string
        organization:
          $ref: '#/components/schemas/github_com_l3montree-dev_devguard_database_models.Org'
        organizationId:
          description: will be null for global policies
          type: string
        predicateType:
          type: string
        projects:
          items:
            $ref: '#/components/schemas/github_com_l3montree-dev_devguard_database_models.Project'
          type: array
          uniqueItems: false
        rawEvaluationResult:
          additionalProperties: {}
          type: object
        rego:
          type: string
        title:
          type: string
        violations:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
      - compliant
      - description
      - id
      - opaqueId
      - organization
      - organizationId
      - predicateType
      - projects
      - rawEvaluationResult
      - rego
      - title
      - violations
      type: object
    controllers.ArtifactRequest:
      properties:
        artifactName:
          type: string
        informationSources:
          items:
            $ref: '#/components/schemas/controllers.informationSource'
          type: array
          uniqueItems: false
      required:
      - artifactName
      - informationSources
      type: object
    controllers.ArtifactUpdateResponse:
      properties:
