    AdminSignedAuth:
      description: Instance admin authentication using ECDSA P-256 HTTP message signing.
        Requires Signature, Signature-Input and Content-Digest headers.
      in: header
      name: Signature
      type: apiKey
    BearerAuth:
      description: 'Bearer token authentication. Set value to: Bearer dvg_…'
      in: header
      name: Authorization
      type: apiKey
    CookieAuth:
      description: Session-based authentication using Ory Kratos
      in: cookie
      name: ory_kratos_session
      type: apiKey
