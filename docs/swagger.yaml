          description: OK
      security:
      - CookieAuth: []
      - PATAuth: []
      - BearerAuth: []
      summary: List externally managed project/asset tree
      tags:
      - External Entity
    post:
      description: Called by external inventory providers (e.g. k8s-devguard-image-inventory)
        to upsert or delete a dynamically managed project hierarchy. On verb=update,
        creates or updates the project, sub-project, asset, asset version and artifact,
        then processes the supplied CycloneDX SBOM and triggers a vulnerability scan.
        On verb=delete, removes the artifact/asset-version/asset/project entries cascading
        upward as long as no other data references them.
      parameters:
      - description: Organization slug
        in: path
        name: organization
        required: true
        schema:
          type: string
      - description: Project slug
        in: path
        name: projectSlug
        required: true
        schema:
          type: string
      - description: External provider ID
        in: path
        name: providerID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dtos.ExternalSubprojectRequestDTO'
              description: Request body
              summary: body
        description: Request body
        required: true
      responses:
        "200":
          description: OK
      security:
      - CookieAuth: []
      - PATAuth: []
      - BearerAuth: []
      summary: Sync or delete an externally managed project/asset tree
      tags:
      - External Entity
