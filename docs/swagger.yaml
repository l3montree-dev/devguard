  /v2/{secret}/{registry}/{ns1}/{ns2}/{image}/tags/list:
    get:
      parameters:
      - description: dependency proxy secret
        in: path
        name: secret
        schema:
          type: string
      - description: registry hostname
        in: path
        name: registry
        required: true
        schema:
          type: string
      - description: image namespace
        in: path
        name: namespace
        schema:
          type: string
      - description: image name
        in: path
        name: image
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
      security:
