  /vex:
    post:
      parameters:
      - description: Tag flag
        in: header
        name: X-Tag
        schema:
          type: string
      - description: Default branch
        in: header
        name: X-Asset-Default-Branch
        schema:
          type: string
      - description: Origin
        in: header
        name: X-Origin
        schema:
          type: string
      - description: Asset name as <organization>/<project>/<asset>
        in: header
        name: X-Asset-Name
        required: true
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              title: body
              type: object
        description: CycloneDX VEX BOM
        required: true
      responses:
        "200":
          description: OK
      security:
      - CookieAuth: []
      - PATAuth: []
      - BearerAuth: []
      summary: Upload VEX document
      tags:
      - Scanning
  /vulndb:
    get:
      description: Get a paginated list of CVEs with optional filtering and sorting
      parameters:
      - description: Page number
        in: query
        name: page
        schema:
          type: integer
      - description: Number of items per page
        in: query
        name: limit
        schema:
          type: integer
      - description: Sort by field, e.g. 'sort[cve]=asc
        in: query
        name: sort
        schema:
          type: string
      - description: Filter query, e.g. 'filterQuery[cvss][is greater than]=4'
        in: query
        name: filter
        schema:
          type: string
      - description: Confidentiality Requirements (low, medium, high), default is
          medium
        in: query
        name: confidentialityRequirements
        schema:
          type: string
      - description: Integrity Requirements (low, medium, high), default is medium
        in: query
        name: integrityRequirements
        schema:
          type: string
      - description: Availability Requirements (low, medium, high), default is medium
        in: query
        name: availabilityRequirements
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/github_com_l3montree-dev_devguard_database_models.CVE'
                    type: array
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
                type: object
          description: A paginated list of CVEs
        "500":
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Internal server error
      summary: List all CVEs with pagination
      tags:
      - CVE Database
      - CVE
  /vulndb/{cveID}/:
    get:
      description: Retrieve details of a specific CVE by its ID, including risk and
        vector calculations
      parameters:
      - description: CVE ID
        in: path
        name: cveID
        required: true
        schema:
          type: string
      - description: Confidentiality Requirements (low, medium, high), default is
          medium
        in: query
        name: confidentialityRequirements
        schema:
          type: string
      - description: Integrity Requirements (low, medium, high), default is medium
        in: query
        name: integrityRequirements
        schema:
          type: string
      - description: Availability Requirements (low, medium, high), default is medium
        in: query
        name: availabilityRequirements
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_l3montree-dev_devguard_database_models.CVE'
          description: Details of the specified CVE" and optional advisories
        "500":
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Internal server error
      summary: Get a specific CVE by ID
      tags:
      - CVE Database
      - CVE
  /vulndb/cve-ecosystem-distribution:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: integer
                type: object
          description: OK
      summary: Get the CVE distribution across ecosystems
      tags:
      - VulnDB
  /vulndb/list-ids-by-creation-date:
    get:
      parameters:
      - description: Offset to start fetching data from
        in: query
        name: offset
        schema:
          type: integer
      - description: Maximum number of entries to return
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      properties:
                        createdAt:
                          type: string
                        cve:
                          type: string
                        datePublished:
                          type: string
                      type: object
                    type: array
                  total:
                    type: integer
                type: object
          description: OK
      summary: List CVE IDs sorted by creation date
      tags:
      - VulnDB
  /vulndb/purl-inspect/{purl}:
    get:
      description: Analyze a given PURL, determine its match context, and return affected
        components and related vulnerabilities
      parameters:
      - description: Package URL (PURL) to inspect
        in: path
        name: purl
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/controllers.PURLInspectResponse'
          description: Inspection result including PURL, match context, affected components,
            and vulnerabilities
        "400":
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Invalid PURL provided
        "500":
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                type: object
          description: Internal server error
      summary: Inspect a package URL (PURL) for vulnerabilities
      tags:
      - VulnDB
  /webhook:
    post:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
      summary: Handle incoming third-party integration webhook
      tags:
      - Integrations
  /whoami:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  ownerID:
                    type: string
                  ownerType:
                    type: string
                type: object
          description: OK
      security:
      - CookieAuth: []
      - PATAuth: []
      summary: Get current session info
      tags:
      - Authentication
