            $ref: '#/components/schemas/dtos.VulnInPackageDTO'
          type: array
          uniqueItems: false
      required:
      - affectedComponents
      - component
      - maliciousPackage
      - matchContext
      - purl
      - vulns
      type: object
    controllers.informationSource:
      properties:
        purl:
