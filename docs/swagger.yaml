        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dtos.OrgDTO'
          description: OK
      security:
      - CookieAuth: []
      - PATAuth: []
      - BearerAuth: []
      summary: Accept organization invitation
      tags:
      - Organizations
  /admin:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                type: object
          description: OK
      security:
      - AdminSignedAuth: []
      summary: Confirm admin credentials are accepted
      tags:
      - Admin
  /admin/assets/{assetID}/:
    patch:
      parameters:
      - description: Asset ID
        in: path
        name: assetID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dtos.UpdateAssetRequest'
              description: Request body
              summary: body
        description: Request body
        required: true
      responses:
        "200":
          description: OK
      security:
      - AdminSignedAuth: []
      summary: Update an asset's slug
      tags:
      - Admin
  /admin/daemons/asset-pipeline-all/trigger:
    post:
      description: Runs the full asset pipeline (scan, sync, risk calculation, statistics)
        for every asset on this instance. Returns an SSE stream with log, done, and
        error events. Subject to a 5-minute cooldown.
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: 'SSE stream (event: log | done | error)'
        "429":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/echo.HTTPError'
          description: Cooldown not elapsed – try again later
      security:
      - AdminSignedAuth: []
      summary: Trigger the asset pipeline for all assets
      tags:
      - Admin Daemons
  /admin/daemons/asset-pipeline-single/trigger:
    post:
      description: Runs the full asset pipeline for one asset identified by its UUID.
        Returns an SSE stream with log, done, and error events. Subject to a 5-minute
        cooldown per asset.
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: body
              type: object
        description: Request body
        required: true
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: 'SSE stream (event: log | done | error)'
        "400":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/echo.HTTPError'
          description: Invalid or missing assetId
        "429":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/echo.HTTPError'
          description: Cooldown not elapsed – try again later
      security:
      - AdminSignedAuth: []
      summary: Trigger the asset pipeline for a single asset
      tags:
      - Admin Daemons
  /admin/daemons/fixed-versions/trigger:
    post:
      description: Updates known fixed versions for tracked vulnerabilities. Returns
        an SSE stream with log, done, and error events. Subject to a 5-minute cooldown.
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: 'SSE stream (event: log | done | error)'
        "429":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/echo.HTTPError'
          description: Cooldown not elapsed – try again later
      security:
      - AdminSignedAuth: []
      summary: Trigger the Fixed Versions daemon
      tags:
      - Admin Daemons
  /admin/daemons/open-source-insights/trigger:
    post:
      description: Syncs open-source project metadata from deps.dev. Returns an SSE
        stream with log, done, and error events. Subject to a 5-minute cooldown (enforced
        across all API instances via the config DB).
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: 'SSE stream (event: log | done | error)'
        "429":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/echo.HTTPError'
          description: Cooldown not elapsed – try again later
      security:
      - AdminSignedAuth: []
      summary: Trigger the Open Source Insights daemon
      tags:
      - Admin Daemons
  /admin/daemons/vulndb/trigger:
    post:
      description: Runs an incremental VulnDB import from upstream diffs. Sets the
        vulndb.vulndb config timestamp at the start of processing. Returns an SSE
        stream with log, done, and error events. Subject to a 5-minute cooldown.
      responses:
        "200":
          content:
            text/event-stream:
