name: VulnDB Workflow v6

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"

permissions:
  contents: read
  packages: write

env:
  POSTGRES_DB: devguard
  POSTGRES_USER: devguard
  POSTGRES_HOST: localhost
  POSTGRES_PASSWORD: not_reachable_from_the_internet

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: "doesntmatter"
    services:
      postgres:
        image: ghcr.io/l3montree-dev/devguard/postgresql:16.16@sha256:95d38573cd3fddf47309f53c57f36b1e82fb6130de9c20f9912f7aeb909f9845
        env:
          POSTGRES_DB: ${{env.POSTGRES_DB}}
          POSTGRES_USER: ${{env.POSTGRES_USER}}
          POSTGRES_PASSWORD: ${{env.POSTGRES_PASSWORD}}
        ports:
          - 5432:5432
        options: '--health-cmd="pg_isready -U devguard" --shm-size=1g --health-interval=10s --health-timeout=5s --health-retries=5 --tmpfs /docker-entrypoint-initdb.d --tmpfs /run/postgresql'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install Golang
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
      
      - name: Migrate the database
        run: |
          go run ./cmd/devguard-cli/main.go migrate

      - name: Export the vulnerability database archive
        run: |
          # writes the database snapshot files and bundles them into a single tar.zst archive
          go run ./cmd/devguard-cli/main.go vulndb export --diffToPrevious

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: "v2.6.1"

      - name: Write signing key to disk
        run: echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key

      - name: Sign the database archive
        env:
          COSIGN_PASSWORD: ""
        run: |
          cosign import-key-pair --key cosign.key
          cosign sign-blob --yes --key import-cosign.key vulndb.tar.zst > vulndb.tar.zst.sig
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup oras cli
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      - name: Push the database archive to GitHub Container Registry
        run: |
          oras push ghcr.io/l3montree-dev/devguard/vulndb/v6:latest \
            vulndb.tar.zst
      - name: Push the archive signature to the GitHub Container Registry
        run: |
          oras push ghcr.io/l3montree-dev/devguard/vulndb/v6:latest.sig \
            vulndb.tar.zst.sig
